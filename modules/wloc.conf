#!name=Apple WLOC 定位修改
#!desc=Apple 网络定位修改 | 使用说明: https://github.com/ActionRobotAI/WLOC#使用方法
#!author=Anonymous Rewrite
#!homepage=https://github.com/ActionRobotAI/WLOC

[rewrite_local]
^https?:\/\/(?:gs-loc(?:-cn)?\.apple\.com|gsp-ssl\.ls\.apple\.com|bluedot\.is\.autonavi\.com(?:\.gds\.alibabadns\.com)?)\/clls\/wloc url script-response-body https://raw.githubusercontent.com/ActionRobotAI/WLOC/main/scripts/wloc.js
^https?:\/\/gs-loc(-cn)?\.apple\.com\/wloc-settings\/save url script-echo-response https://raw.githubusercontent.com/ActionRobotAI/WLOC/main/scripts/wloc-settings.js

[mitm]
hostname = gs-loc.apple.com, gs-loc-cn.apple.com, gsp-ssl.ls.apple.com, bluedot.is.autonavi.com, bluedot.is.autonavi.com.gds.alibabadns.com
